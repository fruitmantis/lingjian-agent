# Independent postmaster; never include original PG configuration.
listen_addresses = '127.0.0.1'
port = 55432
unix_socket_directories = '/run/banfei-agentarts-pg'
unix_socket_permissions = 0700
hba_file = '/etc/banfei-agentarts/pg_hba.conf'
ident_file = '/etc/banfei-agentarts/pg_ident.conf'
password_encryption = 'scram-sha-256'
log_destination = 'stderr'
logging_collector = off

[Service]
Environment=HOME=/var/lib/banfei-caddy
Environment=XDG_DATA_HOME=/var/lib/banfei-caddy/data
Environment=XDG_CONFIG_HOME=/var/lib/banfei-caddy/config
Environment=XDG_CACHE_HOME=/var/cache/banfei-caddy
StateDirectory=banfei-caddy
StateDirectoryMode=0750
CacheDirectory=banfei-caddy
CacheDirectoryMode=0750
LogsDirectory=banfei-caddy
LogsDirectoryMode=0750
ExecCondition=/usr/local/libexec/banfei-environment-preflight original http
StandardOutput=append:/var/log/banfei-caddy/runtime.log
StandardError=append:/var/log/banfei-caddy/runtime.log
SyslogIdentifier=banfei-caddy
